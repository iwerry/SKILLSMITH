name: SKILLSMITH CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: |
          python -m skillsmith validate --strict skill-smith
          python -m skillsmith create --name sample-planning --purpose "Creates planning reports" --when "the user requests a planning report" --not-for "budget approvals" --output generated
          python -m skillsmith validate generated/sample-planning
          python -m skillsmith audit generated/sample-planning
          python -m skillsmith package generated/sample-planning --output dist
